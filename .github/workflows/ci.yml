# Mirage CI (DEC-002 build-test baseline, project-standards section 7).
#
# Every job checks out the pinned submodules and configures in verify-only
# mode (MIRAGE_FETCH_DEPENDENCIES=OFF): a checkout whose submodule pointers
# drift from dependencies.lock.json must fail configure, not the build
# (RULE-06). The preset matrix mirrors the M1 exit conditions; TSan runs
# under setarch -R because current runner kernels ship ASLR entropy that
# GCC TSan cannot map (see README).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: format & public-header boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Configure (verify-only dependency mode)
        run: cmake --preset debug -DMIRAGE_FETCH_DEPENDENCIES=OFF
      - name: Format check
        run: cmake --build --preset debug --target mirage-format-check
      - name: Public header boundary check (RULE-01)
        run: cmake --build --preset debug --target mirage-boundary-check

  build:
    name: build & test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, ubsan, tsan]
    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install ccache and X11 test prerequisites
        run: sudo apt-get update && sudo apt-get install -y ccache libx11-dev libxtst-dev
          libxrandr-dev xvfb at-spi2-core dbus
      - name: ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-${{ matrix.preset }}-${{ runner.os }}-
            ${{ hashFiles('dependencies.lock.json', 'CMakeLists.txt',
            'CMakePresets.json', 'cmake/*.cmake') }}
          restore-keys: ccache-${{ matrix.preset }}-${{ runner.os }}-
      - name: Configure (verify-only dependency mode)
        run: >
          cmake --preset ${{ matrix.preset }}
          -DMIRAGE_FETCH_DEPENDENCIES=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test (TSan with disabled ASLR, see README)
        if: matrix.preset == 'tsan'
        working-directory: build/tsan
        run: setarch $(uname -m) -R ctest --output-on-failure
      - name: Test
        if: matrix.preset != 'tsan'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  windows:
    # M4-01 Windows backend compile gate (DEC-017 decision 1/9): MSVC is the
    # product toolchain; this job builds the desktop/platform subset because
    # the IPC and persistence transports are still POSIX-only until M4-06
    # wires the named-pipe and store variants. Runtime evidence for the
    # win32 frontend comes from this runner's interactive desktop; its
    # capability is confirmed on the first PR run and any gap is recorded
    # per the skip discipline (never a silent pass).
    name: windows msvc (platform subset)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure (verify-only dependency mode)
        run: cmake -S . -B build/windows -A x64 -DMIRAGE_FETCH_DEPENDENCIES=OFF
      - name: Build platform subset
        run: >-
          cmake --build build/windows --config Debug
          --target mirage_desktop mirage_platform provider_contract_test
          desktop_observation_test observation_assembler_test permission_test
          win32_backend_test
      - name: Test
        run: >-
          ctest --test-dir build/windows -C Debug --output-on-failure
          -R "^(provider_contract_test|desktop_observation_test|observation_assembler_test|permission_test|win32_backend_test)$"
      # The invariant-style win32 test prints its check summary and the
      # session-capability notes (foreground lock, SendInput refusals) on
      # stderr; ctest hides passing output, so re-run it verbose to keep
      # that evidence in the log (DEC-017 decision 9 record).
      - name: Win32 frontend evidence
        run: >-
          ctest --test-dir build/windows -C Debug -R "^win32_backend_test$"
          --output-on-failure -V

  frontend:
    name: frontend contracts & app (M1.5-06)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Plain shallow checkout: the frontend gate needs only the source tree
      # (golden vectors included), never the pinned submodules.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Type check (contracts + app, strict tsc)
        working-directory: ui
        run: npm run check
      - name: Test (golden vectors + contracts + app)
        working-directory: ui
        run: npm test
      - name: Build
        working-directory: ui
        run: npm run build
